services:
  nginx:
    image: nginx:alpine
    container_name: sakhisafe-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - frontend
      - backend
      - ai-service
      - messaging-service

  certbot:
    image: certbot/certbot
    container_name: sakhisafe-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

  postgres:
    image: pgvector/pgvector:pg16
    container_name: postgres-main
    restart: unless-stopped
    environment:
      POSTGRES_DB: sakhi_safe_app
      POSTGRES_USER: sakhisafe_user
      POSTGRES_PASSWORD: sakhisafe_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sakhisafe_user -d sakhi_safe_app"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-ai:
    image: postgres:16
    container_name: postgres-ai
    restart: unless-stopped
    environment:
      POSTGRES_USER: sakhi_user
      POSTGRES_PASSWORD: sakhi_password
      POSTGRES_DB: sakhi_safe
    ports:
      - "5433:5432"
    volumes:
      - postgres_ai_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sakhi_user -d sakhi_safe"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./SakhiSafe-Backend
      dockerfile: Dockerfile
    container_name: sakhisafe-backend
    restart: unless-stopped
    env_file:
      - ./SakhiSafe-Backend/.env
    environment:
      APP_PORT: 4000
      FRONTEND_URL: https://sakhisafe.bestdevelopers.tech
      DATABASE_URL: postgresql://sakhisafe_user:sakhisafe_password@postgres:5432/sakhi_safe_app?schema=public
    volumes:
      - evidence_uploads:/app/private/uploads
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./SakhiSafe-Frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://sakhisafe.bestdevelopers.tech
    container_name: sakhisafe-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: https://sakhisafe.bestdevelopers.tech
    depends_on:
      - backend

  ai-service:
    build:
      context: ./SakhiSafe-Backend/SakhiSafe/ai-service
      dockerfile: Dockerfile
    container_name: sakhisafe-ai-service
    restart: unless-stopped
    env_file:
      - ./SakhiSafe-Backend/SakhiSafe/ai-service/.env
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      DATABASE_URL: postgresql+asyncpg://sakhi_user:sakhi_password@postgres-ai:5432/sakhi_safe
      NEST_INTERNAL_BASE_URL: http://backend:4000
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/application_default_credentials.json
    volumes:
      - ./SakhiSafe-Backend/SakhiSafe/ai-service/main.py:/app/main.py
      - ./SakhiSafe-Backend/SakhiSafe/ai-service/app:/app/app
      - ./SakhiSafe-Backend/SakhiSafe/ai-service/services:/app/services
      - ./SakhiSafe-Backend/SakhiSafe/ai-service/prompts:/app/prompts
      - media-uploads:/app/media
    command: uvicorn main:app --host 0.0.0.0 --port 8080 --reload
    depends_on:
      postgres-ai:
        condition: service_healthy

  messaging-service:
    build:
      context: ./SakhiSafe-Backend/SakhiSafe/messaging-service
      dockerfile: Dockerfile
    container_name: sakhisafe-messaging-service
    restart: unless-stopped
    env_file:
      - ./SakhiSafe-Backend/SakhiSafe/messaging-service/.env
    environment:
      TARGET_URL: http://ai-service:8080/messaging
    volumes:
      - ./SakhiSafe-Backend/SakhiSafe/messaging-service/app:/app/app
      - media-uploads:/app/uploads
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - ai-service

volumes:
  postgres_data:
  postgres_ai_data:
  evidence_uploads:
  media-uploads:
