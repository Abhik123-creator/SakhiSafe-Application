services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: sakhi_safe_app
      POSTGRES_USER: sakhisafe_user
      POSTGRES_PASSWORD: sakhisafe_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sakhisafe_user -d sakhi_safe_app"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./SakhiSafe-Backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./SakhiSafe-Backend/.env
    environment:
      APP_PORT: 4000
      FRONTEND_URL: http://localhost:3000
      DATABASE_URL: postgresql://sakhisafe_user:sakhisafe_password@postgres:5432/sakhi_safe_app?schema=public
    ports:
      - "4000:4000"
    volumes:
      - evidence_uploads:/app/private/uploads
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./SakhiSafe-Frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  evidence_uploads:
